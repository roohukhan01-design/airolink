name: Build AirLink APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put files in place
        run: |
          mkdir -p www assets
          cp index.html www/
          cp icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png assets/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Add the Wi-Fi server code
        run: |
          D=android/app/src/main/java/com/roohu/airlink
          mkdir -p $D android/app/src/main/assets
          cp LanServer.java LanClient.java Beacon.java LanSharePlugin.java MainActivity.java $D/
          cp pc.html android/app/src/main/assets/pc.html
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AirLink-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
